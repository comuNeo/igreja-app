<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa de Oração - Comunidade Neo</title>
    <script src="qrcode.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #08180f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }
        .art-wrapper {
            position: relative;
            max-width: 520px;
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .art-bg {
            width: 100%;
            height: auto;
            display: block;
        }
        .qr-overlay {
            position: absolute;
            top: 68.4%;
            left: 36.8%;
            width: 25.0%;
            height: 20.6%;
            background: #ffffff;
            padding: 5px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-overlay canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
        .link-overlay {
            position: absolute;
            top: 89.2%;
            left: 10%;
            width: 80%;
            background: transparent;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            text-align: center;
            padding: 3px 6px;
            border-radius: 6px;
        }
        .link-overlay span {
            display: block;
            font-size: clamp(9px, 2.2vw, 12px);
            color: #e6c675;
            font-weight: bold;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
        }
        .link-overlay a {
            color: #ffffff;
            font-size: clamp(10px, 2.5vw, 13px);
            font-weight: bold;
            text-decoration: underline;
            word-break: break-all;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
        }
        .actions {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 520px;
            width: 100%;
        }
        .admin-link {
            color: #c9a656;
            font-size: 0.85rem;
            text-decoration: none;
        }
        @media print {
            .actions { display: none; }
            body { background: #08180f; padding: 0; }
        }
    </style>
</head>
<body>

    <div class="art-wrapper">
        <img src="cartaz.jpeg" alt="Caixa de Oração Comunidade Neo" class="art-bg">
        
        <div class="qr-overlay">
            <canvas id="qr-canvas"></canvas>
        </div>

        <div class="link-overlay">
            <span>VOCÊ PODE ACESSAR POR AQUI TAMBÉM!</span>
            <a id="current-url" href="pedido.html"></a>
        </div>
    </div>

    <div class="actions">
        <a href="admin.html" class="admin-link">🔒 Acessar Área Restrita (Liderança)</a>
    </div>

    <script>
        window.onload = function() {
            const pedidoUrl = new URL('pedido.html', window.location.href).href;
            const linkElement = document.getElementById('current-url');
            linkElement.innerText = pedidoUrl;
            linkElement.href = pedidoUrl;
            gerarQRCode('qr-canvas', pedidoUrl);
        };
    </script>
</body>
</html>
