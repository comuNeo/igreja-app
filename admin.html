<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Restrita - Pedidos de Oração</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-view" class="container">
        <div class="card login-card">
            <div class="logo-placeholder" style="width: 60px; height: 60px; font-size: 24px;">🔒</div>
            <h2 class="section-title">Acesso Restrito</h2>
            <p class="subtitle">Área exclusiva para a liderança</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="login-user">Login</label>
                    <input type="text" id="login-user" required>
                </div>
                <div class="form-group">
                    <label for="login-pass">Senha</label>
                    <input type="password" id="login-pass" required>
                </div>
                <button type="submit">Entrar</button>
            </form>
        </div>
    </div>

    <!-- TELA DO RELATÓRIO (APARECE APÓS LOGIN) -->
    <div id="admin-view" class="admin-container hidden">
        <div class="card">
            <div class="admin-header">
                <h2 class="section-title">Relatório de Pedidos de Oração</h2>
                <div class="admin-actions">
                    <button onclick="exportCSV()" class="btn-export">📥 Baixar Excel (CSV)</button>
                    <button onclick="logout()" class="btn-logout">Sair</button>
                </div>
            </div>

            <table id="prayers-table">
                <thead>
                    <tr>
                        <th>Data / Hora</th>
                        <th>Nome</th>
                        <th>WhatsApp</th>
                        <th>Pedido de Oração</th>
                    </tr>
                </thead>
                <tbody id="prayers-list"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
